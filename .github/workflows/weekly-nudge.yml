name: Weekly content nudge

on:
  schedule:
    # Sunday 11h Paris time (CEST = UTC+2)
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check activity in the last 7 days
        id: check
        run: |
          SINCE=$(date -u -d "7 days ago" +%Y-%m-%dT00:00:00)
          COUNT=$(git log --since="$SINCE" --oneline | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Send Discord nudge
        if: steps.check.outputs.count == '0'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MSG="Rien commite sur \`portfolio-site\` cette semaine. Une idee de PoC ou d'article a documenter ?"
          curl -s -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MSG" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"
